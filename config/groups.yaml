# Робочі чати для тестування груп відділень.
# env_var — ім'я змінної в .env з id групи (-100...) або @username
groups:
  - id: stationary
    title: "Стаціонарні автоматизовані"
    env_var: WORK_GROUP_STATIONARY_ID

  - id: mobile
    title: "Пересувні відділення (ПВПЗ)"
    env_var: WORK_GROUP_MOBILE_ID