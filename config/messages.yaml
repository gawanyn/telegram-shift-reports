# Тексти можна редагувати без зміни коду.
# Плейсхолдери: {mentions}, {name}, {username}

reminder:
  - "Колеги, нагадую про необхідність при закритті зміни надати показники за результатами сьогоднішнього дня у цей чат."
  - "Вітаю команду! Прошу не забути в кінці робочого дня внести дані щодо пенсій, торгівлі та передплати."
  - "Нагадування для сьогоднішньої зміни: чекаю на ваші щоденні звіти після завершення обслуговування клієнтів."

missing_in_group: |
  ⏰ Станом на **{time}** ще немає звіту від: {mentions}

  Будь ласка, надішліть повідомлення у встановленому форматі.

dm_missing: |
  Вітаю! Чекаю на Ваш підсумковий звіт за зміну в робочому чаті. 
  Стандартний формат: Індекс, Пенсія, Товар, Передплата. 
  Якщо вже відправили — дайте знати 🤝

zero_trade_followups:
  # === Нейтрально-уточнюючі (Перевірка на помилку) ===
  - "{name}, у звіті Торгівля — 0. Підтвердіть: торгівлі сьогодні не було, чи це помилка в цифрах?"
  - "{name}, бачу нульову торгівлю. Це фактичний нуль за зміну чи потрібно виправити суму?"
  - "{name}, торгівля 0 грн — все вірно? Якщо ні, надішліть виправлений рядок у тому ж форматі."
  - "{name}, система зафіксувала 0 грн торгівлі. Якщо це одруківка, продублюйте правильний звіт."
  - "Перевірка звіту: {name}, у вас вказано 0 грн продажів. Підтвердіть, що помилки немає."

  # === Питання про причини (Стимулюють діалог) ===
  - "{name}, жодного продажу товару за зміну? Напишіть, будь ласка, причину такої ситуації."
  - "{name}, нуль по касі за товар — чи не було сьогодні клієнтів на відділенні?"
  - "Звіт прийнято, але {name}, звертаю увагу на 0 грн торгівлі. Зовсім не було попиту сьогодні?"
  - "{name}, бачу нульовий виторг. Напишіть коротко, чому сьогодні не вдалося реалізувати товар."
  - "Фіксую 0 грн торгівлі. {name}, чи були якісь технічні перебої, чи просто відсутність попиту?"

  # === Суворіші / Мотивуючі (Акцент на результат) ===
  - "{name}, бачу нуль по торгівлі. Сподіваюся на вашу активність та кращий результат наступної зміни."
  - "{name}, сьогодні без продажів товару? Проаналізуйте ситуацію, такий результат нас не влаштовує."
  - "{name}, торгівля 0 грн — це критично низький показник. Зверніть на це увагу завтра!"
  - "Прийнято, але {name}, нуль по товару — це не той результат, який ми очікуємо. Прошу посилити продажі."
  - "{name}, фіксую відсутність торгівлі. Зробіть висновки та пропрацюйте пропозицію клієнтам на наступній зміні."


zero_prepayment_followups:
  # === Нейтрально-уточнюючі (Перевірка на помилку) ===
  - "{name}, Передплата — 0 шт. Підтвердіть: передплат не було, чи помилка при введенні звіту?"
  - "{name}, нульова передплата у звіті — це очікувано за сьогодні, чи забули внести цифру?"
  - "{name}, 0 передплат — підтвердіть, будь ласка, або надішліть виправлений звіт."
  - "{name}, система зчитала 0 передплат. Перевірте свої дані, якщо є помилка — надішліть знову."
  - "Уточнення по звіту: {name}, передплат 0. Усе правильно введено?"

  # === Питання про причини (Стимулюють діалог) ===
  - "{name}, жодної оформленої передплати за день? Не вдалося сьогодні залучити клієнтів?"
  - "Зверніть увагу: {name}, у вас 0 по передплатах. Напишіть коротко причину."
  - "{name}, сьогодні зовсім без передплат? Були якісь труднощі в роботі з клієнтами?"
  - "Звіт отримав. {name}, чому сьогодні нуль передплат? Ніхто не цікавився пресою?"
  - "{name}, бачу відсутність передплат. Люди відмовлялися чи не було можливості запропонувати?"

  # === Суворіші / Мотивуючі (Акцент на результат) ===
  - "Звіт бачу, але {name}, нуль по передплаті — це тривожний показник. Чекаю активності на наступній зміні!"
  - "{name}, прикро бачити нуль у графі передплат. Прошу посилити роботу в цьому напрямку."
  - "{name}, нульовий результат по передплаті нас не влаштовує. Зробіть висновки до наступного робочого дня."
  - "{name}, 0 передплат. Нагадую, що це обов'язковий напрямок. Завтра чекаю на оформлені квитанції!"
  - "Фіксую 0 передплат. {name}, прошу змінити підхід до пропозиції послуг клієнтам, такий результат не підходить."

parse_error_reply: |
  Не вдалося розібрати звіт. Надішліть у форматі:
  77503, Долина 3, Виплачена пенсія — 120, Торгівля — 1500 грн, Передплата — 10 шт.

# Оціночні емодзі та фрази для кожного показника окремо
performance_markers:
    overfulfilled: "🚀 Перевиконано! (100%+)" 
    normal: "✅ План виконано! (90-99%)"
    attention: "🟡 Потребує доопрацювання (50-89%)"
    critical: "🚨 Критичний стан! (<50%)"

# Загальні фінальні підсумки дня на основі успіху обидвох показників
battle_cries:
  both_win:  # Якщо і торгівля, і передплата >= 90%
    - "💪 Чудова робота! Обидва напрямки відпрацьовані на високому рівні. Щиро дякую за професіоналізм!"
    - "✨ Прекрасні результати! День закрили зразково за всіма показниками. Так тримати!"
    - "💎 Дякую за старанність! Виконано і торгівлю, і передплату — справжня майстерність від нашої команди."
    - "🌟 Чудовий день! Обидва плани під контролем. Ваша праця та досвід дають чудові плоди!"
    - "📈 Зразкові показники! Колеги, ви сьогодні виклалися на всі сто відсотків. Дякуємо за турботу про клієнтів!"
    - "🤝 Обидва завдання виконано успішно. Дякую за вашу надійність та відданість справі!"
  one_win:   # Якщо підтягнули тільки щось одне
    - "📌 Хороший результат! Один показник у нормі, а над іншим — давайте разом піднатиснемо наступної зміни."
    - "👍 Дякую за роботу! Маємо хорошу базу. Завтра звернемо трішки більше уваги на той напрямок, що відстає."
    - "🌾 Початок хороший! Торгівля або передплата порадували, тепер тримаємо фокус, щоб вирівняти обидва плани."
    - "🌱 Непогані цифри! Один показник підтягнули чудово, віримо, що наступна зміна підніме й інший."
    - "📝 Звіт прийнято. Результат вагомий, але для повного балансу нам потрібно трішки посилити другий напрямок."
    - "💡 Дякую за старання! Крок за кроком рухаємося вперед. Завтра спробуємо підтягнути показник, що залишився."
  both_low:  # Якщо обидва показники просіли або нулі
    - "🛒 Шановні колеги, сьогодні результати дещо просіли. Зверніть, будь ласка, увагу на роботу з клієнтами та вітрину."
    - "⚠️ Сьогодні показники слабкі. Знаю, що бувають важкі дні, але завтра чекаємо від вас більшої активності."
    - "📉 Показники дня потребують покращення. Будь ласка, проаналізуйте попит і прикладіть зусиль наступної зміни."
    - "📢 Колеги, потрібно піднімати цифри за обома напрямками. Надіюся на вашу відповідальність та досвід завтра."
    - "🔍 Результати дня нижчі за очікувані. Зберіться, будь ласка, попереду новий день і нові можливості для виконання плану."
    - "🛑 Сьогодні плани не виконали. Прохання активізувати роботу з відвідувачами, щоб надолужити втрачене."
  zero_alert:
      - "🛑 Шановні колеги, нуль у звіті — це відсутність роботи з клієнтами. Будь ласка, перегляньте підхід до продажів уже завтра!"
      - "🔍 Звіт прийнято, але нульовий результат за напрямком неприпустимий. Надіюся на вашу активність та досвід наступної зміни."
      - "⚠️ Колеги, нулі погіршують загальний результат усього підрозділу. Прохання завтра прикласти максимум зусиль, щоб виправити це."

