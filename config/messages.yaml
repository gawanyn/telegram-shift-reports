# Тексти можна редагувати без зміни коду.
# Плейсхолдери: {mentions}, {name}, {username}

reminder:
    - "⏰ **Нагадування!** Шановні начальники, не забудьте надіслати вечірні звіти за сьогодні."
    - "📝 **Час звітів!** Будь ласка, зафіксуйте свої показники та скиньте звіт у чат."
    - "📌 **Дисципліна понад усе!** Нагадую про необхідність здати щоденний звіт до кінця зміни."
    - "📊 **Звітна пауза!** Чекаю на ваші дані щодо пенсій, торгівлі та передплати."
    - "🔔 **Увага!** Нагадую, що успішне закриття дня починається зі вчасно зданого звіту."
    - "✨ **Традиційне вечірнє нагадування!** Начальники, підготуйте та надішліть, будь ласка, звіти."

missing_in_group: |
  ⏰ О 19:00 ще немає звіту від: {mentions}

  Будь ласка, надішліть повідомлення у встановленому форматі.

dm_missing: |
  Привіт! Очікую ваш щоденний звіт у робочому чаті (формат як у нагадуванні о 17:00). Якщо вже надіслали — напишіть, перевірю.

zero_trade_followups:
  - "{name}, у звіті Торгівля — 0. Підтвердіть: торгівлі сьогодні не було, чи це помилка в цифрах?"
  - "{name}, бачу нульову торгівлю. Це фактичний нуль за зміну чи потрібно виправити суму?"
  - "{name}, торгівля 0 грн — все вірно? Якщо ні, надішліть виправлений рядок у тому ж форматі."

zero_prepayment_followups:
  - "{name}, Передплата — 0 шт. Підтвердіть: передплат не було, чи помилка?"
  - "{name}, нульова передплата у звіті — це очікувано за сьогодні?"
  - "{name}, 0 передплат — підтвердіть, будь ласка, або надішліть виправлений звіт."

parse_error_reply: |
  Не вдалося розібрати звіт. Надішліть у форматі:
  77503, Долина 3, Виплачена пенсія — 120, Торгівля — 1500 грн, Передплата — 10 шт.

