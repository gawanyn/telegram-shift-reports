# Тексти можна редагувати без зміни коду.
# Плейсхолдери: {mentions}, {name}, {username}

reminder:
    - "⏰ **Нагадування!** Шановні начальники, не забудьте надіслати вечірні звіти за сьогодні."
    - "📝 **Час звітів!** Будь ласка, зафіксуйте свої показники та скиньте звіт у чат."
    - "📌 **Дисципліна понад усе!** Нагадую про необхідність здати щоденний звіт до кінця зміни."
    - "📊 **Звітна пауза!** Чекаю на ваші дані щодо пенсій, торгівлі та передплати."
    - "🔔 **Увага!** Нагадую, що успішне закриття дня починається зі вчасно зданого звіту."
    - "✨ **Традиційне вечірнє нагадування!** Начальники, підготуйте та надішліть, будь ласка, звіти."

missing_in_group: |
  ⏰ О 19:00 ще немає звіту від: {mentions}

  Будь ласка, надішліть повідомлення у встановленому форматі.

dm_missing: |
  Привіт! Очікую ваш щоденний звіт у робочому чаті (формат як у нагадуванні о 17:00). Якщо вже надіслали — напишіть, перевірю.

zero_trade_followups:
  - "{name}, у звіті Торгівля — 0. Підтвердіть: торгівлі сьогодні не було, чи це помилка в цифрах?"
  - "{name}, бачу нульову торгівлю. Це фактичний нуль за зміну чи потрібно виправити суму?"
  - "{name}, торгівля 0 грн — все вірно? Якщо ні, надішліть виправлений рядок у тому ж форматі."

zero_prepayment_followups:
  - "{name}, Передплата — 0 шт. Підтвердіть: передплат не було, чи помилка?"
  - "{name}, нульова передплата у звіті — це очікувано за сьогодні?"
  - "{name}, 0 передплат — підтвердіть, будь ласка, або надішліть виправлений звіт."

parse_error_reply: |
  Не вдалося розібрати звіт. Надішліть у форматі:
  77503, Долина 3, Виплачена пенсія — 120, Торгівля — 1500 грн, Передплата — 10 шт.

# Оціночні емодзі та фрази для кожного показника окремо
performance_markers:
  overfulfilled: "🚀 Перевиконано!"  # >= 100%
  normal: "✅ Виконано"            # 70% - 99%
  low: "📉 Недостатньо"           # < 70%

# Загальні фінальні підсумки дня на основі успіху обидвох показників
battle_cries:
  both_win:  # Якщо і торгівля, і передплата >= 70%
    - "💪 Чудова робота! Обидва напрямки відпрацьовані на високому рівні. Щиро дякую за професіоналізм!"
    - "✨ Прекрасні результати! День закрили зразково за всіма показниками. Так тримати!"
    - "💎 Дякую за старанність! Виконано і торгівлю, і передплату — справжня майстерність від нашої команди."
    - "🌟 Чудовий день! Обидва плани під контролем. Ваша праця та досвід дають чудові плоди!"
    - "📈 Зразкові показники! Колеги, ви сьогодні виклалися на всі сто відсотків. Дякуємо за турботу про клієнтів!"
    - "🤝 Обидва завдання виконано успішно. Дякую за вашу надійність та відданість справі!"
  one_win:   # Якщо підтягнули тільки щось одне
    - "📌 Хороший результат! Один показник у нормі, а над іншим — давайте разом піднатиснемо наступної зміни."
    - "👍 Дякую за роботу! Маємо хорошу базу. Завтра звернемо трішки більше уваги на той напрямок, що відстає."
    - "🌾 Початок хороший! Торгівля або передплата порадували, тепер тримаємо фокус, щоб вирівняти обидва плани."
    - "🌱 Непогані цифри! Один показник підтягнули чудово, віримо, що наступна зміна підніме й інший."
    - "📝 Звіт прийнято. Результат вагомий, але для повного балансу нам потрібно трішки посилити другий напрямок."
    - "💡 Дякую за старання! Крок за кроком рухаємося вперед. Завтра спробуємо підтягнути показник, що залишився."
  both_low:  # Якщо обидва показники просіли або нулі
    - "🛒 Шановні колеги, сьогодні результати дещо просіли. Зверніть, будь ласка, увагу на роботу з клієнтами та вітрину."
    - "⚠️ Сьогодні показники слабкі. Знаю, що бувають важкі дні, але завтра чекаємо від вас більшої активності."
    - "📉 Показники дня потребують покращення. Будь ласка, проаналізуйте попит і прикладіть зусиль наступної зміни."
    - "📢 Колеги, потрібно піднімати цифри за обома напрямками. Надіємося на вашу відповідальність та досвід завтра."
    - "🔍 Результати дня нижчі за очікувані. Зберіться, будь ласка, попереду новий день і нові можливості для виконання плану."
    - "🛑 Сьогодні плани не виконали. Прохання активізувати роботу з відвідувачами, щоб надолужити втрачене."

